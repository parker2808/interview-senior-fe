name: Deploy study-plan to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'study-plan/**'
      - '.github/workflows/deploy-study-plan.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-study-plan
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: study-plan/app/package-lock.json

      - name: Install
        working-directory: study-plan/app
        run: npm ci

      - name: Build
        working-directory: study-plan/app
        env:
          GITHUB_PAGES: 'true'
        run: npm run build


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: study-plan/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
