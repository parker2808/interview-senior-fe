# Deploy the study-plan-30-days follow UI (only module with a site for now).
# Shared interview KB lives under documents/ and is not published by this build.

[build]
  base = "modules/study-plan-30-days/src"
  command = "npm run build"
  publish = "dist"

# Paths are relative to [build].base
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API before SPA fallback — Blobs-backed progress (see netlify/functions/progress.js)
[[redirects]]
  from = "/api/progress"
  to = "/.netlify/functions/progress"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
